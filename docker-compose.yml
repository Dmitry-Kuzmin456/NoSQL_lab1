services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nosql_store
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nosql_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  riak:
    image: basho/riak-kv:ubuntu-2.2.3
    platform: linux/amd64
    hostname: riak
    environment:
      CLUSTER_NAME: riakkv
    labels:
      com.basho.riak.cluster.name: riakkv
    ports:
      - "8087:8087"
      - "8098:8098"
    volumes:
      - riak-data:/var/lib/riak
      - ./backend/scripts/riak-prestart.sh:/etc/riak/prestart.d/00-prestart.sh:ro
      - ./backend/scripts/riak-poststart.sh:/etc/riak/poststart.d/00-poststart.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:8098/ping >/dev/null && [ -f /tmp/.riak_initialized ] || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      riak:
        condition: service_healthy

volumes:
  postgres-data:
  riak-data:
