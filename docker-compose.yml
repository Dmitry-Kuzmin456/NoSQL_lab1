services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nosql_store
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nosql_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  riak:
    image: basho/riak-kv:ubuntu-2.2.3
    platform: linux/amd64
    environment:
      CLUSTER_NAME: riakkv
    labels:
      com.basho.riak.cluster.name: riakkv
    ports:
      - "8087:8087"
      - "8098:8098"
    volumes:
      - riak-data:/var/lib/riak
      - riak-schemas:/etc/riak/schemas
    healthcheck:
      test: ["CMD-SHELL", "riak-admin wait-for-service riak_kv >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      riak:
        condition: service_healthy

volumes:
  postgres-data:
  riak-data:
  riak-schemas:
