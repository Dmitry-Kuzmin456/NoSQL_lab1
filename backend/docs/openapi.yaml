  /api/products:
    get:
      tags:
      - Products
      summary: Получить каталог товаров с фильтрацией и пагинацией
      operationId: list_products_api_products_get
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Поисковый запрос по названию или описанию
          title: Query
        description: Поисковый запрос по названию или описанию
      - name: min_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          description: Минимальная цена
          title: Min Price
        description: Минимальная цена
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          description: Максимальная цена
          title: Max Price
        description: Максимальная цена
      - name: in_stock_only
        in: query
        required: false
        schema:
          type: boolean
          description: Только товары в наличии
          default: false
          title: In Stock Only
        description: Только товары в наличии
      - name: sort_by
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProductSortBy'
          description: Сортировка товаров
          default: popularity
        description: Сортировка товаров
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Смещение (offset)
          default: 0
          title: Offset
        description: Смещение (offset)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Лимит на страницу
          default: 50
          title: Limit
        description: Лимит на страницу
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
