name: lint and type check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check src
      - name: Ruff (format)
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src
      - name: Mypy
        if: ${{ !cancelled() }}
        run: uv run mypy src
