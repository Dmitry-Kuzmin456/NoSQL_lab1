components:
  schemas:
    AddFavouriteRequest:
      properties:
        product_id:
          type: string
          format: uuid
          title: Product Id
          description: ID добавляемого товара
      type: object
      required:
      - product_id
      title: AddFavouriteRequest
    AddProductToStudentsRequest:
      properties:
        product_id:
          type: string
          format: uuid
          title: Product Id
          description: ID рекомендуемого товара
      type: object
      required:
      - product_id
      title: AddProductToStudentsRequest
    AddStudentRequest:
      properties:
        student_id:
          type: string
          format: uuid
          title: Student Id
          description: ID прикрепляемого ученика
      type: object
      required:
      - student_id
      title: AddStudentRequest
    BatchAddProductResponse:
      properties:
        product_id:
          type: string
          format: uuid
          title: Product Id
        affected_students:
          type: integer
          title: Affected Students
        student_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Student Ids
      type: object
      required:
      - product_id
      - affected_students
      - student_ids
      title: BatchAddProductResponse
    CartItemResponse:
      properties:
        product_id:
          type: string
          format: uuid
          title: Product Id
        quantity:
          type: integer
          title: Quantity
        updated_at:
          type: string
          format: date-time
          title: Updated At
        product:
          anyOf:
          - $ref: '#/components/schemas/ProductResponse'
          - type: 'null'
        subtotal:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Subtotal
          description: Подытог по позиции (цена * кол-во)
          default: '0.00'
        is_available:
          type: boolean
          title: Is Available
          description: Доступен ли товар на складе в запрашиваемом количестве
          default: true
        available_stock:
          type: integer
          title: Available Stock
          description: Текущий остаток на складе
          default: 0
      type: object
      required:
      - product_id
      - quantity
      - updated_at
      title: CartItemResponse
    CartResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        items:
          items:
            $ref: '#/components/schemas/CartItemResponse'
          type: array
          title: Items
        total_items:
          type: integer
          title: Total Items
        total_amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Amount
          description: Общая стоимость товаров в корзине
          default: '0.00'
        has_unavailable_items:
          type: boolean
          title: Has Unavailable Items
          description: Есть ли в корзине недоступные товары
          default: false
      type: object
      required:
      - user_id
      - items
      - total_items
      title: CartResponse
    ChangePasswordRequest:
      properties:
        old_password:
          type: string
          minLength: 1
          title: Old Password
        new_password:
          type: string
          maxLength: 128
          minLength: 6
          title: New Password
      type: object
      required:
      - old_password
      - new_password
      title: ChangePasswordRequest
    CheckoutResponse:
      properties:
        orders:
          items:
            $ref: '#/components/schemas/OrderResponse'
          type: array
          title: Orders
        total_orders:
          type: integer
          title: Total Orders
        total_amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Amount
      type: object
      required:
      - orders
      - total_orders
      - total_amount
      title: CheckoutResponse
    CreateOrderRequest:
      properties:
        product_id:
          type: string
          format: uuid
          title: Product Id
          description: ID заказываемого товара
        quantity:
          type: integer
          exclusiveMinimum: 0.0
          title: Quantity
          description: Количество товара (должно быть > 0)
          default: 1
      type: object
      required:
      - product_id
      title: CreateOrderRequest
    CreateProductRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          examples:
          - Ноутбук ThinkPad
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
          examples:
          - Ноутбук для программирования и учебы
        price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Price
          examples:
          - '79990.00'
        quantity:
          type: integer
          minimum: 0.0
          title: Quantity
          default: 0
          examples:
          - 10
      type: object
      required:
      - name
      - price
      title: CreateProductRequest
